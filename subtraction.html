<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>引き算</title>

</head>

<body>

    <p>

        <span id="number1">72895</span> - <span id="number2">100</span> = <span id="answer"></span>
    </p>
    <script>

        document.querySelector('#answer').innerText = document.querySelector('#number1').innerText - document.querySelector('#number2').innerText
    </script>

</body>

</html>
