<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>赤さん</title>
        <style>
            .red {color:#c2000033;
                /* ここに書き込む */
            }
            .big {font-size: 30px;
                /* ここに書き込む */
            }
            .serif {font-family:serif;
                /* ここに書き込む */
            }
        </style>
    </head>
    <body>
        <p>ただの文字</p>
        <p class="red">赤き文字</p>
        <p class="big">でかい文字</p>
        <p class="serif">シャレオツな文字</p>
        <p class="red big">でかい赤き文字</p>
        <p class="big serif">でかいシャレオツな文字</p>
        <p class="red serif">シャレオツな赤き文字</p>
        <p class="red big serif">でかいシャレオツな赤き文字</p>
    </body>
</html>
