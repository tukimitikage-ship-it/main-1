<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>display</title>
    <style>
        #none {
            display: none;
        }

        #inline * {
            display: inline;
        }

        #flex {
            display: flex;
            justify-content: space-around;
        }

        #grid {
              display: grid;
    grid-template-columns: 1fr 1fr;
        }
        #block span{
            display: block;
        }
    </style>
</head>

<body>
    <p id="none">ないです</p>
    <div id="inline">
        <p>ないです</p>
        <p>ないです</p>
        <p>ないです</p>
        <p>ないです</p>
    </div>
    <div id="flex">
        <p>ないです</p>
        <p>ないです</p>
        <p>ないです</p>
        <p>ないです</p>
    </div>
    <div id="grid">
        <p>ないです</p>
        <p>ないです</p>
        <p>ないです</p>
        <p>ないです</p>
    </div>
    <div id="block">
        <span>ないです</span>
        <span>ないです</span>
        <span>ないです</span>
        <span>ないです</span>
    </div>
</body>

</html>
