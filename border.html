<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title></title>
    <style>
        p:first-child {
            border: 1px solid;
        }

        p:nth-child(2) {
            border: 1px dashed;
        }

        p:nth-child(3) {
            border: 1px dotted;
        }

        p:nth-child(4) {
            border: 8px double red;
        }

        p:last-child {
            border: 5px groove greenyellow;
        }
    </style>
</head>

<body>
    <p>枠が沸くのでワクワクしてます</p>
    <p>枠が沸くのでワクワクしてます</p>
    <p>枠が沸くのでワクワクしてます</p>
    <p>枠が沸くのでワクワクしてます</p>
    <p>枠が沸くのでワクワクしてます</p>
</body>

</html>
