<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>見返り美人図</title>
    <style>
        body {
            background: linear-gradient(90deg, #7c44e4, #65c053);
        }

        #red {
            background: linear-gradient(90deg, cyan, #fffd6b);
            color: red;
        }

        #white {
            background-color: #000000;
            color: white;

        }

        #cyan {
            background: linear-gradient(90deg, yellow, #3263ac);
            color: cyan;
        }

        #yellow {
            background: linear-gradient(90deg, red, #1b9261);
            color: yellow;
        }
    </style>
</head>

<body>
    <p id="red">青い文字</p>
    <p id="white">茶色い文字</p>
    <p id="cyan">赤い文字</p>
    <p id="yellow">黒い文字</p>
</body>

</html>
