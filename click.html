<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Click</title>
</head>

<body>
    <button>超すごいボタン</button>
    <script>
        document.querySelector('button').addEventListener("click", a);
        function a() {
            alert("超すごいボタン");
        }
    </script>


</body>

</html>
